openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: restaurants
    description: Restaurant discovery
  - name: products
    description: Menu products
  - name: orders
    description: Customer orders
  - name: dashboard
    description: Operational summaries
  - name: verification
    description: Email verification during registration and sign-in
  - name: Auth
    description: Browser and mobile authentication endpoints
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [Auth]
      summary: Exchange a mobile authorization code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [Auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  # Comprobación simple para saber si el API está disponible.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  # Catálogo público que consume la experiencia del cliente.
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List restaurants
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  # Menú asociado a un restaurante.
  /restaurants/{restaurantId}/products:
    get:
      operationId: listRestaurantProducts
      tags: [products]
      summary: List restaurant products
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  # Lectura y creación de pedidos.
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List recent orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/claim:
    post:
      operationId: claimOrder
      tags: [orders]
      summary: Claim an unassigned order for delivery
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierClaimInput"
      responses:
        "200":
          description: Order claimed by this delivery partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
        "409":
          description: Order is no longer available
  # Detalle individual del pedido.
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order detail
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  # Actualización del flujo operativo del pedido.
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  # Datos resumidos para la consola administrativa.
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get operational summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /auth/verification/send:
    post:
      operationId: sendRegistrationCode
      tags: [verification]
      summary: Send a one-time registration or sign-in code by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCodeRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCodeSent"
        "429":
          description: Too many requests
        "502":
          description: Mail provider unavailable
  /auth/verification/confirm:
    post:
      operationId: confirmRegistrationCode
      tags: [verification]
      summary: Confirm a one-time registration or sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCodeConfirmation"
      responses:
        "200":
          description: Code verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCodeVerified"
        "400":
          description: Incorrect or expired code
        "429":
          description: Too many attempts
  /auth/business-admin-requests:
    get:
      operationId: listBusinessAdminRegistrationRequests
      tags: [Auth]
      summary: List pending business administrator registration requests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAdminRegistrationRequests"
        "401":
          description: Authentication required
        "403":
          description: System administrator role required
  /auth/business-admin-requests/{userId}/decision:
    post:
      operationId: decideBusinessAdminRegistrationRequest
      tags: [Auth]
      summary: Approve or reject a business administrator registration request
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessAdminRegistrationDecision"
      responses:
        "200":
          description: Request decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAdminRegistrationDecisionResult"
        "400":
          description: Invalid decision
        "401":
          description: Authentication required
        "403":
          description: System administrator role required
        "404":
          description: Pending request not found
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
        role:
          type: string
          enum: [cliente, administrador_negocio, repartidor, administrador_sistema]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RegistrationCodeRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role: { type: string, enum: [cliente, administrador_negocio, repartidor, administrador_sistema] }
    RegistrationCodeConfirmation:
      type: object
      required: [email, role, code]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role: { type: string, enum: [cliente, administrador_negocio, repartidor, administrador_sistema] }
        code: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationCodeSent:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
    RegistrationCodeVerified:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
    BusinessAdminRegistrationRequest:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        createdAt: { type: string, format: date-time }
    BusinessAdminRegistrationRequests:
      type: array
      items:
        $ref: "#/components/schemas/BusinessAdminRegistrationRequest"
    BusinessAdminRegistrationDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
    BusinessAdminRegistrationDecisionResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Restaurant:
      type: object
      required: [id, name, cuisine, rating, deliveryMinutes, deliveryFee, isOpen, image]
      properties:
        id: { type: number }
        name: { type: string }
        cuisine: { type: string }
        rating: { type: number }
        deliveryMinutes: { type: number }
        deliveryFee: { type: number }
        isOpen: { type: boolean }
        image: { type: string }
        featured: { type: boolean }
    Product:
      type: object
      required: [id, restaurantId, name, description, price, category, image, popular]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        image: { type: string }
        popular: { type: boolean }
    OrderItem:
      type: object
      required: [id, name, quantity, price]
      properties:
        id: { type: number }
        name: { type: string }
        quantity: { type: number }
        price: { type: number }
    Order:
      type: object
      required: [id, restaurantName, customerName, total, status, paymentMethod, createdAt, items]
      properties:
        id: { type: number }
        restaurantName: { type: string }
        customerName: { type: string }
        total: { type: number }
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
        paymentMethod:
          type: string
          enum: [cash, yape, card]
        createdAt: { type: string }
        deliveryAddress: { type: string }
        deliveryPartnerEmail: { type: string }
        deliveryPartnerName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    CourierClaimInput:
      type: object
      required: [courierEmail, courierName]
      properties:
        courierEmail: { type: string, minLength: 3 }
        courierName: { type: string, minLength: 1 }
    OrderInput:
      type: object
      required: [restaurantName, customerName, total, paymentMethod, deliveryAddress, items]
      properties:
        restaurantName: { type: string }
        customerName: { type: string }
        total: { type: number }
        paymentMethod:
          type: string
          enum: [cash, yape, card]
        deliveryAddress: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
    DashboardSummary:
      type: object
      required: [todaySales, activeOrders, restaurants, deliveryPartners, weeklySales]
      properties:
        todaySales: { type: number }
        activeOrders: { type: number }
        restaurants: { type: number }
        deliveryPartners: { type: number }
        weeklySales:
          type: array
          items:
            type: object
            required: [day, total]
            properties:
              day: { type: string }
              total: { type: number }

