openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: restaurants
    description: Restaurant discovery
  - name: products
    description: Menu products
  - name: orders
    description: Customer orders
  - name: dashboard
    description: Operational summaries
  - name: verification
    description: Email verification during registration and sign-in
  - name: Auth
    description: Browser and mobile authentication endpoints
paths:
  /account:
    get:
      operationId: getAccountProfile
      tags: [Auth]
      responses:
        "200":
          description: Own account profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    patch:
      operationId: saveAccountProfile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountProfile" }
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /operations/state:
    get:
      operationId: getOperationsState
      tags: [dashboard]
      responses:
        "200":
          description: Role-scoped operational data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [users, businesses, products, categories, orders, settings]
                properties:
                  users: { type: array, items: { type: object, additionalProperties: true } }
                  businesses: { type: array, items: { type: object, additionalProperties: true } }
                  products: { type: array, items: { type: object, additionalProperties: true } }
                  categories: { type: array, items: { type: object, additionalProperties: true } }
                  orders: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  settings: { type: object, additionalProperties: { type: string } }
  /operations/{entity}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string, enum: [users, businesses, products, categories, settings] } }
    post:
      operationId: createOperationalEntity
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRecord" }
      responses:
        "201":
          description: Created record
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    patch:
      operationId: updateOperationalSettings
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRecord" }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /operations/{entity}/{id}:
    parameters:
      - { name: entity, in: path, required: true, schema: { type: string, enum: [users, businesses, products, categories] } }
      - { name: id, in: path, required: true, schema: { type: number, minimum: 1 } }
    patch:
      operationId: updateOperationalEntity
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRecord" }
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    delete:
      operationId: deleteOperationalEntity
      tags: [dashboard]
      responses:
        "200":
          description: Record removed
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } }, required: [success] }
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [dashboard]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: date, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: businessId, in: query, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Delivered-order sales, in America/Lima
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
  /reports/sales.pdf:
    get:
      operationId: downloadSalesReport
      tags: [dashboard]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: date, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: businessId, in: query, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: PDF sales report
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /orders/{orderId}/assignment:
    put:
      operationId: assignOrderCourier
      tags: [orders]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierAssignmentInput" }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{orderId}/proof:
    post:
      operationId: saveDeliveryProof
      tags: [orders]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImageUploadInput" }
      responses:
        "200":
          description: Delivered with private photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{orderId}/rating:
    put:
      operationId: rateOrder
      tags: [orders]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: number, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RatingInput" }
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /files:
    post:
      operationId: uploadProductImage
      tags: [products]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImageUploadInput" }
      responses:
        "201":
          description: Uploaded public product image
          content:
            application/json:
              schema: { type: object, required: [path], properties: { path: { type: string } } }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /mobile-auth/token-exchange:
    post:
      operationId: exchangeMobileAuthorizationCode
      tags: [Auth]
      summary: Exchange a mobile authorization code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
  /mobile-auth/logout:
    post:
      operationId: logoutMobileSession
      tags: [Auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  # Comprobación simple para saber si el API está disponible.
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  # Catálogo público que consume la experiencia del cliente.
  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List restaurants
      responses:
        "200":
          description: Restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"
  # Menú asociado a un restaurante.
  /restaurants/{restaurantId}/products:
    get:
      operationId: listRestaurantProducts
      tags: [products]
      summary: List restaurant products
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  # Lectura y creación de pedidos.
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List recent orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}/claim:
    post:
      operationId: claimOrder
      tags: [orders]
      summary: Claim an unassigned order for delivery
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierClaimInput"
      responses:
        "200":
          description: Order claimed by this delivery partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
        "409":
          description: Order is no longer available
  # Detalle individual del pedido.
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order detail
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  # Actualización del flujo operativo del pedido.
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  # Datos resumidos para la consola administrativa.
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get operational summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /auth/verification/send:
    post:
      operationId: sendRegistrationCode
      tags: [verification]
      summary: Send a one-time registration or sign-in code by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCodeRequest"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCodeSent"
        "429":
          description: Too many requests
        "502":
          description: Mail provider unavailable
  /auth/verification/confirm:
    post:
      operationId: confirmRegistrationCode
      tags: [verification]
      summary: Confirm a one-time registration or sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationCodeConfirmation"
      responses:
        "200":
          description: Code verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCodeVerified"
        "400":
          description: Incorrect or expired code
        "429":
          description: Too many attempts
  /auth/business-admin-requests:
    get:
      operationId: listBusinessAdminRegistrationRequests
      tags: [Auth]
      summary: List pending business administrator registration requests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAdminRegistrationRequests"
        "401":
          description: Authentication required
        "403":
          description: System administrator role required
  /auth/business-admin-requests/{userId}/decision:
    post:
      operationId: decideBusinessAdminRegistrationRequest
      tags: [Auth]
      summary: Approve or reject a business administrator registration request
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessAdminRegistrationDecision"
      responses:
        "200":
          description: Request decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessAdminRegistrationDecisionResult"
        "400":
          description: Invalid decision
        "401":
          description: Authentication required
        "403":
          description: System administrator role required
        "404":
          description: Pending request not found
components:
  schemas:
    OperationalRecord:
      type: object
      additionalProperties: true
    CourierAssignmentInput:
      type: object
      required: [courierId]
      properties:
        courierId: { type: [number, "null"], minimum: 1 }
    ImageUploadInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    RatingInput:
      type: object
      required: [rating]
      properties:
        rating: { type: number, minimum: 1, maximum: 5 }
    AccountProfile:
      type: object
      required: [name, phone, address]
      properties:
        name: { type: string, minLength: 1, maxLength: 250 }
        phone: { type: string, maxLength: 250 }
        address: { type: string, maxLength: 250 }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
        role:
          type: string
          enum: [cliente, administrador_negocio, repartidor, administrador_sistema]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RegistrationCodeRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role: { type: string, enum: [cliente, administrador_negocio, repartidor, administrador_sistema] }
    RegistrationCodeConfirmation:
      type: object
      required: [email, role, code]
      properties:
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$', maxLength: 254 }
        role: { type: string, enum: [cliente, administrador_negocio, repartidor, administrador_sistema] }
        code: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationCodeSent:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
    RegistrationCodeVerified:
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
    BusinessAdminRegistrationRequest:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$' }
        createdAt: { type: string, format: date-time }
    BusinessAdminRegistrationRequests:
      type: array
      items:
        $ref: "#/components/schemas/BusinessAdminRegistrationRequest"
    BusinessAdminRegistrationDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
    BusinessAdminRegistrationDecisionResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Restaurant:
      type: object
      required: [id, name, cuisine, rating, deliveryMinutes, deliveryFee, isOpen, image]
      properties:
        id: { type: number }
        name: { type: string }
        cuisine: { type: string }
        rating: { type: number }
        deliveryMinutes: { type: number }
        deliveryFee: { type: number }
        isOpen: { type: boolean }
        image: { type: string }
        featured: { type: boolean }
    Product:
      type: object
      required: [id, restaurantId, name, description, price, category, image, popular]
      properties:
        id: { type: number }
        restaurantId: { type: number }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        category: { type: string }
        image: { type: string }
        popular: { type: boolean }
    OrderItem:
      type: object
      required: [id, name, quantity, price]
      properties:
        id: { type: number }
        name: { type: string }
        quantity: { type: number }
        price: { type: number }
    Order:
      type: object
      required: [id, restaurantName, customerName, total, status, paymentMethod, createdAt, items]
      properties:
        businessAddress: { type: string }
        businessPhone: { type: string }
        customerPhone: { type: string }
        deliveryPartnerPhone: { type: string }
        restaurantId: { type: number }
        deliveryFee: { type: number }
        deliveredAt: { type: string }
        rating: { type: [number, "null"] }
        proofUrl: { type: string }
        customerUserId: { type: string }
        deliveryPartnerUserId: { type: string }
        id: { type: number }
        restaurantName: { type: string }
        customerName: { type: string }
        total: { type: number }
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
        paymentMethod:
          type: string
          enum: [cash, yape, card]
        createdAt: { type: string }
        deliveryAddress: { type: string }
        deliveryPartnerEmail: { type: string }
        deliveryPartnerName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    CourierClaimInput:
      type: object
      required: [courierEmail, courierName]
      properties:
        courierEmail: { type: string, minLength: 3 }
        courierName: { type: string, minLength: 1 }
    OrderInput:
      type: object
      required: [restaurantName, customerName, total, paymentMethod, deliveryAddress, items]
      properties:
        restaurantName: { type: string }
        customerName: { type: string }
        total: { type: number }
        paymentMethod:
          type: string
          enum: [cash, yape, card]
        deliveryAddress: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
    DashboardSummary:
      type: object
      required: [todaySales, activeOrders, restaurants, deliveryPartners, weeklySales]
      properties:
        todaySales: { type: number }
        activeOrders: { type: number }
        restaurants: { type: number }
        deliveryPartners: { type: number }
        weeklySales:
          type: array
          items:
            type: object
            required: [day, total]
            properties:
              day: { type: string }
              total: { type: number }
    SalesReport:
      type: object
      required: [period, date, start, end, businesses, totals]
      properties:
        period: { type: string }
        date: { type: string }
        start: { type: string }
        end: { type: string }
        businesses:
          type: array
          items:
            type: object
            required: [businessId, businessName, orders, units, productSales, deliveryFees, total, items]
            properties:
              businessId: { type: number }
              businessName: { type: string }
              orders: { type: number }
              units: { type: number }
              productSales: { type: number }
              deliveryFees: { type: number }
              total: { type: number }
              items:
                type: array
                items:
                  type: object
                  required: [productId, name, quantity, subtotal]
                  properties:
                    productId: { type: number }
                    name: { type: string }
                    quantity: { type: number }
                    subtotal: { type: number }
        totals:
          type: object
          required: [orders, units, productSales, deliveryFees, total]
          properties:
            orders: { type: number }
            units: { type: number }
            productSales: { type: number }
            deliveryFees: { type: number }
            total: { type: number }

